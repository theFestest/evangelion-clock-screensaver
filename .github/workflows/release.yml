name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web toolchain
        run: npm ci

      - name: Generate webview assets
        run: npx grunt build

      - name: Native logic tests
        run: npm run test:native

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Visual and behavior tests
        run: npm test

      - name: Build screensaver
        run: xcodebuild -project "Evangelion Clock.xcodeproj" -target "Evangelion Clock" -configuration Release ONLY_ACTIVE_ARCH=NO build

      - name: Verify universal binary
        run: |
          BIN="build/Release/Evangelion Clock.saver/Contents/MacOS/Evangelion Clock"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64
          lipo -info "$BIN" | grep -q x86_64

      - name: Zip saver bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/Release/Evangelion Clock.saver" "Evangelion-Clock.saver.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Evangelion-Clock.saver
          path: Evangelion-Clock.saver.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Evangelion-Clock.saver.zip --title "$GITHUB_REF_NAME" --generate-notes
